name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck --shell=bash bin/pbtalk bin/pbtrace

  syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh (Linux)
        # Ubuntu runners do not ship zsh by default.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: bash -n
        run: |
          bash -n bin/pbtalk
          bash -n bin/pbtrace
      - name: zsh parse check
        run: |
          zsh -n bin/pbtalk
          zsh -n bin/pbtrace

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        # Ubuntu's apt ships bats 0.4.0 (pre-1.0), too old for modern test
        # syntax. Install bats-core via npm instead.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl zsh
          sudo npm install -g bats
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core jq
      - name: Show versions
        run: |
          bats --version
          jq --version
          bash --version | head -1
          zsh --version
      - name: Run bats unit tests
        env:
          BATS_SHELL: ${{ matrix.shell }}
        run: |
          bats tests/unit

  language-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Japanese characters outside README.ja.md
        # Match Hiragana / Katakana / CJK Unified Ideographs.
        # Symbols like ▸ or — are allowed; only the Japanese script blocks
        # are forbidden.
        run: |
          set +e
          found=$(LC_ALL=C.UTF-8 grep -nrIP '[\x{3040}-\x{309F}\x{30A0}-\x{30FF}\x{4E00}-\x{9FFF}]' \
              bin/ tests/ .github/ \
              CHANGELOG.md LICENSE README.md examples/ 2>/dev/null)
          if [ -n "$found" ]; then
            echo "Japanese characters found outside README.ja.md:" >&2
            echo "$found" >&2
            exit 1
          fi
